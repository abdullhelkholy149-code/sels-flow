name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salesflow
          POSTGRES_PASSWORD: salesflow
          POSTGRES_DB: salesflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesflow -d salesflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://salesflow:salesflow@localhost:5432/salesflow_test?schema=public
      TEST_DATABASE_URL: postgresql://salesflow:salesflow@localhost:5432/salesflow_test?schema=public
      AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars_long
      SIGNED_LINK_SECRET: ci_link_secret_that_is_at_least_32_chars_long
      LOG_PRETTY: 'false'
      WHATSAPP_PROVIDER: console

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations on an empty database
        run: npm run db:deploy

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: |
          set -o pipefail
          npm run test:int 2>&1 | tee /tmp/integration.log
          status=${PIPESTATUS[0]}
          # A red pipeline that only says "integration tests failed" costs a
          # round trip to the log before anyone learns which test broke. The
          # failing names go into the job summary and into annotations on this
          # step, so the reason is on the checks page and in the commit.
          if [ "$status" -ne 0 ]; then
            sed -i 's/\x1b\[[0-9;]*m//g' /tmp/integration.log
            {
              echo "## Integration tests failed"
              echo
              echo '```'
              grep -nE '(^|[[:space:]])(FAIL|×)|AssertionError|Error:' /tmp/integration.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^|[[:space:]])(FAIL|×)|AssertionError|Error:' /tmp/integration.log \
              | head -10 \
              | while IFS= read -r line; do
                  printf '::error title=integration::%s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-180)"
                done
          fi
          exit "$status"

      - name: Dependency audit
        run: npm audit --audit-level=high

  # The acceptance criteria of phase 0 include a served Arabic page and a
  # health endpoint that reports the database as up. Both are checked here, so a
  # prerender or runtime regression fails the pipeline instead of the first
  # person who opens the app.
  serve:
    name: Build and serve
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salesflow
          POSTGRES_PASSWORD: salesflow
          POSTGRES_DB: salesflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesflow -d salesflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://salesflow:salesflow@localhost:5432/salesflow?schema=public
      AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars_long
      SIGNED_LINK_SECRET: ci_link_secret_that_is_at_least_32_chars_long
      LOG_PRETTY: 'false'
      WHATSAPP_PROVIDER: console

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:setup

      - name: Build
        run: npm run build

      - name: Start the production server
        run: |
          npm run start &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done

      - name: Health endpoint reports the database as up
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/health.json
          grep -qE '"status": ?"ok"' /tmp/health.json
          grep -qE '"database": ?"up"' /tmp/health.json

      - name: The Arabic page is served right to left
        run: |
          curl -fsS http://127.0.0.1:3000/ar -o /tmp/ar.html
          grep -q 'lang="ar"' /tmp/ar.html
          grep -q 'dir="rtl"' /tmp/ar.html

      - name: Security headers are present
        run: |
          curl -fsSI http://127.0.0.1:3000/ar | grep -qi '^x-content-type-options: nosniff'
          curl -fsSI http://127.0.0.1:3000/ar | grep -qi '^x-frame-options: DENY'
          curl -fsSI http://127.0.0.1:3000/ar | grep -qi '^content-security-policy:'
          curl -fsSI http://127.0.0.1:3000/ar | grep -qi "frame-ancestors 'none'"

      # Phase 1 acceptance: an unauthenticated visitor must not be able to
      # reach a protected screen or a CSV export, and the login screen must
      # hand out the anonymous CSRF cookie the action checks against.
      - name: Protected screens redirect an anonymous visitor to the login screen
        run: |
          for path in /ar/app /ar/change-password /ar/admin/users /ar/admin/audit /ar/admin/settings; do
            location=$(curl -fsSI "http://127.0.0.1:3000$path" | tr -d '\r' | grep -i '^location:' | head -1)
            echo "$path -> $location"
            echo "$location" | grep -q '/ar/login'
          done

      - name: The login screen issues the anonymous CSRF cookie
        run: |
          curl -fsS -c /tmp/jar http://127.0.0.1:3000/ar/login -o /tmp/login.html
          grep -q 'sf_csrf' /tmp/jar
          grep -q 'lang="ar"' /tmp/login.html

      - name: The CSV exports refuse an anonymous caller
        run: |
          # The export must not become a way around the guard on the list it
          # mirrors, so an unauthenticated request gets 401, never a CSV body.
          for path in /api/admin/users.csv /api/admin/audit.csv; do
            status=$(curl -s -o /tmp/export.out -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $status"
            test "$status" = "401"
            grep -qi 'unauthenticated' /tmp/export.out
          done
