name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salesflow
          POSTGRES_PASSWORD: salesflow
          POSTGRES_DB: salesflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesflow -d salesflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://salesflow:salesflow@localhost:5432/salesflow_test?schema=public
      TEST_DATABASE_URL: postgresql://salesflow:salesflow@localhost:5432/salesflow_test?schema=public
      AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars_long
      SIGNED_LINK_SECRET: ci_link_secret_that_is_at_least_32_chars_long
      LOG_PRETTY: 'false'
      WHATSAPP_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations on an empty database
        run: npm run db:deploy

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:int

      - name: Dependency audit
        run: npm audit --audit-level=high
