# SalesFlow - throwaway PostgreSQL for the integration test suite.
# Tests truncate tables between runs, so NEVER point this at real data.
# Usage: docker compose -f docker-compose.test.yml up -d

name: salesflow-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: salesflow-postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesflow}
      POSTGRES_DB: ${TEST_DATABASE_NAME:-salesflow_test}
    ports:
      - '${TEST_POSTGRES_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-salesflow} -d ${TEST_DATABASE_NAME:-salesflow_test}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
